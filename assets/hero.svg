<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392" role="img" aria-labelledby="title description">
  <title id="title">Théo Moron — Software developer</title>
  <desc id="description">Python, FastAPI and PostgreSQL. Applied AI and automation. A restrained navy composition with a single animated path connecting inputs, rules and review. All text remains visible without animation.</desc>
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0B1728"/>
      <stop offset="1" stop-color="#122841"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#79B8FF"/>
      <stop offset="1" stop-color="#67DCC6"/>
    </linearGradient>
  </defs>
  <style>
    .signal { opacity:0; stroke-dasharray: 56 620; stroke-dashoffset: 620; animation: route 3.2s cubic-bezier(.3,0,.2,1) 1; }
    @keyframes route { from { stroke-dashoffset:620; opacity:0; } 12%,80% { opacity:1; } to { stroke-dashoffset:-56; opacity:0; } }
    @media (prefers-reduced-motion: reduce) { .signal { animation:none; display:none; } }
  </style>
  <rect x=".5" y=".5" width="1199" height="391" rx="16" fill="url(#surface)" stroke="#294561"/>
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif">
    <text x="56" y="74" font-size="26" font-weight="500" fill="#B3C7DE">Software developer</text>
    <text x="52" y="176" font-size="88" font-weight="650" letter-spacing="-3" fill="#EFF5FC">Théo Moron</text>
    <text x="56" y="231" font-size="31" fill="#B3C7DE">Applied AI &amp; automation</text>
    <path d="M56 272H690" stroke="#294561"/>
    <text x="56" y="324" font-size="25" font-weight="500" fill="#EFF5FC">Python<tspan fill="#67DCC6"> / </tspan>FastAPI<tspan fill="#67DCC6"> / </tspan>PostgreSQL</text>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M807 92V162Q807 186 831 186H996Q1020 186 1020 210V286" stroke="#294561" stroke-width="2"/>
    <path d="M807 92V162Q807 186 831 186H996Q1020 186 1020 210V286" stroke="url(#route)" stroke-width="2.5" class="signal"/>
    <circle cx="807" cy="92" r="6" fill="#122841" stroke="#79B8FF" stroke-width="2"/>
    <circle cx="913" cy="186" r="6" fill="#122841" stroke="#79B8FF" stroke-width="2"/>
    <circle cx="1020" cy="286" r="6" fill="#122841" stroke="#67DCC6" stroke-width="2"/>
  </g>
  <g font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="22" fill="#B3C7DE">
    <text x="830" y="99">Inputs</text>
    <text x="880" y="151">Rules</text>
    <text x="1041" y="293">Review</text>
  </g>
</svg>
