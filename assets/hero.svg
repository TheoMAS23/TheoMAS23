<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="338" viewBox="0 0 1200 338" role="img" aria-labelledby="ttl desc">
  <title id="ttl">Théo Moron — Software, AI and Automation</title>
  <desc id="desc">Animated navy developer banner, turquoise network details, and a technical editorial layout.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#091523"/><stop offset="60%" stop-color="#0d2031"/><stop offset="100%" stop-color="#0b1724"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#66e4d1"/><stop offset="100%" stop-color="#369dcc"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#4ad7c3" stop-opacity="0"/><stop offset="45%" stop-color="#4ad7c3" stop-opacity=".25"/><stop offset="100%" stop-color="#4ad7c3" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#294557" stroke-width=".65" opacity=".32"/>
    </pattern>
  </defs>
  <style>
    .enter { animation: enter .85s ease-out both; }
    .delay { animation-delay: .22s; }
    .delay2 { animation-delay: .45s; }
    .trace { stroke-dasharray: 520; stroke-dashoffset: 520; animation: trace 2.8s .2s ease-out forwards; }
    .pulse { transform-origin: 1013px 164px; animation: pulse 4.4s ease-in-out infinite; }
    .scan { animation: scan 8s linear infinite; }
    .blink { animation: blink 2.5s ease-in-out infinite; }
    @keyframes enter { from { opacity:0; transform:translateY(10px); } to {opacity:1;transform:translateY(0);} }
    @keyframes trace { to { stroke-dashoffset:0; } }
    @keyframes pulse { 0%,100% {opacity:.65;transform:scale(.98);} 50%{opacity:1;transform:scale(1.045);} }
    @keyframes scan { 0%{transform:translateX(-900px);} 100%{transform:translateX(1250px);} }
    @keyframes blink { 0%,100%{opacity:.35;} 50%{opacity:1;} }
    @media (prefers-reduced-motion: reduce) { * { animation:none!important; } .trace {stroke-dashoffset:0;} }
  </style>
  <rect x=".5" y=".5" width="1199" height="337" rx="17" fill="url(#background)" stroke="#254052"/>
  <rect x="1" y="1" width="1198" height="336" rx="17" fill="url(#grid)" opacity=".65"/>
  <path d="M38 32H1163M38 306H1163" stroke="#294759" stroke-width="1" opacity=".62"/>
  <path d="M38 32V306M1163 32V306" stroke="#294759" stroke-width="1" opacity=".25"/>
  <g class="scan"><rect x="0" y="0" width="180" height="338" fill="url(#fade)"/></g>
  <g font-family="Arial, Helvetica, sans-serif">
    <circle cx="64" cy="66" r="5" fill="#5fddc9" class="blink"/>
    <text x="82" y="71" font-size="13" letter-spacing="3.1" fill="#91acbf" class="enter">SOFTWARE ENGINEERING / APPLIED AI</text>
    <text x="62" y="157" font-size="71" font-weight="700" letter-spacing="-2" fill="#f2f7fc" class="enter delay">THÉO MORON<tspan fill="#60dcca">.</tspan></text>
    <text x="65" y="204" font-size="24" fill="#bdd2df" class="enter delay2">Turning complex processes into reliable systems.</text>
    <path d="M65 227H554" stroke="url(#accent)" stroke-width="2" class="trace"/>
    <text x="65" y="270" font-size="14" letter-spacing="2" fill="#62ddce">PYTHON  /  FASTAPI  /  N8N  /  POSTGRESQL</text>
    <text x="65" y="324" font-size="10.5" letter-spacing="2.3" fill="#7491a5">AUTOMATION     ·     VALIDATION     ·     HUMAN-IN-THE-LOOP</text>
  </g>
  <g opacity=".66" stroke="#41788e" stroke-width="1" fill="none">
    <path d="M785 64H1092V263H785Z" stroke-dasharray="3 8" opacity=".6"/>
    <path d="M819 100L930 163L1090 85M819 228L930 163L1089 251M930 163L1008 118L1090 162L1008 211Z"/>
    <path d="M930 71V263M809 163H1127"/>
    <circle cx="930" cy="163" r="90" stroke-dasharray="3 11" opacity=".5"/>
    <circle cx="930" cy="163" r="126" stroke-dasharray="2 15" opacity=".36"/>
  </g>
  <g class="pulse">
    <circle cx="1013" cy="164" r="62" fill="#2f9cb7" opacity=".06"/>
    <circle cx="1013" cy="164" r="33" fill="#53d6c7" opacity=".08"/>
    <circle cx="1013" cy="164" r="8" fill="#64e4d0"/>
    <circle cx="1013" cy="164" r="15" stroke="#59e0cc" opacity=".8" fill="none"/>
  </g>
  <g fill="#62decf">
    <circle cx="819" cy="100" r="4"/><circle cx="1090" cy="85" r="4"/>
    <circle cx="819" cy="228" r="4"/><circle cx="1089" cy="251" r="4"/>
    <circle cx="930" cy="163" r="5"/><circle cx="1008" cy="118" r="3"/>
    <circle cx="1008" cy="211" r="3"/>
  </g>
  <g font-family="monospace" font-size="11" fill="#83a6b7">
    <text x="801" y="91">01</text><text x="1098" y="80">02</text><text x="1098" y="270">03</text>
    <text x="1130" y="173" fill="#62dfce">ACTIVE</text>
  </g>
</svg>